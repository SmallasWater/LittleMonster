# 刷怪点配置文件
刷新怪物: a1
刷怪点:
  x: 0.0
  y: 0.0
  z: 0.0
  level: "world"
刷怪随机偏移距离: 5
是否刷怪: true
# 刷新规则：支持「固定间隔」或「定时刷新」两种类型
刷新规则:
  # 类型: fixed=固定间隔(秒) | scheduled=定时(星期+时刻)
  类型: fixed
  # fixed 模式专用：刷新间隔秒数
  固定间隔: 10
  # scheduled 模式专用：按星期配置时刻。
  #   - 写法 A（最简）：所有天同一时刻 → 直接写时刻列表
  #   - 写法 B（默认+例外）：用 "*" 设默认，具体星期覆盖
  #   - 写法 C（逐天）：每个星期(1=周一..7=周日)单独配置
  # 星期编号：1=周一 2=周二 3=周三 4=周四 5=周五 6=周六 7=周日（ISO 8601）
  # 时刻格式：HH:mm:ss
  定时时刻:
    "*":
      - "20:00:00"
    "2":
      - "12:00:00"
    "5":
      - "20:00:00"
      - "22:00:00"
刷怪数量: 1
刷怪上限: 1
怪物最大位移距离: -1
刷怪距离: 18
是否显示刷怪点: true
怪物存在时间: 30
公告:
  是否提示: true
  时间:
    - 3600
    - 1800
    - 600
    - 300
  信息: "&e[ &bBOSS提醒 &e] &a{name} 将在 {time} 后复活"
  复活提醒: "&e[ &bBOSS提醒 &e] &a{name} 已复活"
刷怪点标题: "§a>>§l§o LittleMonster §r§a<< "
刷怪点浮空字: |-
      §e>>§a-----------------§e<<
      §e>>§f{名称} §d的刷怪点       §e<<
      §e>>§f数量: §a{数量} §e/§c {上限} §e<<
      §e>>§f刷新时间: §b{time} §f秒   §e<<
      §e>> {name} 努力挑战吧<<
      §e>>§a-----------------§e<<